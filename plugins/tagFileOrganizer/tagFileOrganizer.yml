name: Tag File Organizer
description: Move scene files into folders based on their tags.
version: 0.2.0
exec:
  - python
  - "{pluginDir}/tagFileOrganizer.py"
interface: raw
ui:
  javascript:
    - tagFileOrganizer.js
  css:
    - tagFileOrganizer.css
hooks:
  - name: Organize on scene update
    description: Moves a scene's files when it is saved, if enabled in the settings below.
    triggeredBy:
      - Scene.Update.Post
      - Scene.Create.Post
    defaultArgs:
      mode: hook
settings:
  runOnTagChange:
    displayName: Move when a scene's tags change
    description: "Move a scene as soon as it is saved with new tags."
    type: BOOLEAN
  runManually:
    displayName: Allow the manual tasks to move files
    description: "Let the \"Organize all scenes\" task move files."
    type: BOOLEAN
  sourceFolder:
    displayName: Source folder
    description: "Only move files inside this folder, e.g. your torrents folder. Empty means everywhere."
    type: STRING
  rules:
    displayName: Rules
    description: "Pick tags and a folder for each rule. The rule with the most matching tags wins."
    type: STRING
  dryRun:
    displayName: Dry run
    description: "Only log the moves, don't make them."
    type: BOOLEAN
tasks:
  - name: Organize all scenes
    description: Move every scene in the source folder according to your rules.
    defaultArgs:
      mode: organize
  - name: Preview moves
    description: Log what "Organize all scenes" would move, without moving anything.
    defaultArgs:
      mode: preview
