name: Tag File Organizer
description: Move scene files into folders based on their tags, or move them yourself from the File Info tab.
version: 0.4.1
exec:
  - python
  - "{pluginDir}/tagFileOrganizer.py"
interface: raw
ui:
  javascript:
    - tagFileOrganizer.js
  css:
    - tagFileOrganizer.css
hooks:
  - name: Organize on scene update
    description: Moves a scene's files when it is saved, if enabled in the settings below.
    triggeredBy:
      - Scene.Update.Post
      - Scene.Create.Post
    defaultArgs:
      mode: hook
settings:
  3_runOnTagChange:
    displayName: Move when a scene's tags change
    description: "Move a scene as soon as it is saved with new tags."
    type: BOOLEAN
  1_sourceFolder:
    displayName: Source folder
    description: "Only move files from this folder, e.g. your downloads folder. Empty means everywhere."
    type: STRING
  2_rules:
    displayName: Rules
    description: "Pick tags and a folder for each rule. The rule with the most matching tags wins."
    type: STRING
  5_dryRun:
    displayName: Dry run
    description: "Only log the moves instead of making them when a scene is saved."
    type: BOOLEAN
