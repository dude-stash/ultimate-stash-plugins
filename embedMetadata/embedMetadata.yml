name: Metadata Embedder
description: Embeds Stash scene metadata (title, performers, tags, studio, date, rating, cover image) into MKV/MP4 files using ffmpeg, then rescans them so Stash tracks the new oshash.
version: 1.1.0
url: ""

exec:
  - python
  - "{pluginDir}/embedMetadata.py"

interface: raw
errLog: info

tasks:
  - name: Embed Metadata + Cover Image
    description: Embed metadata tags and cover image (thumbnail) into all MKV/MP4 files.
    defaultArgs:
      dry_run: "false"
      embed_cover: "true"
      rescan: "true"

  - name: Embed Metadata Only
    description: Embed metadata tags only — skips attaching the cover image.
    defaultArgs:
      dry_run: "false"
      embed_cover: "false"
      rescan: "true"

  - name: Dry Run (log only)
    description: Log what would be embedded without modifying any files.
    defaultArgs:
      dry_run: "true"
      embed_cover: "true"
